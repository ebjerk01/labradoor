name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
      - name: Build UI
        run: npm run build
      - name: Gateway tests
        run: python3 -W ignore -m unittest discover -s tests
      - name: Connector tests
        run: |
          for t in connectors/*/test_*.py; do
            [ -f "$t" ] || continue
            python3 -W ignore -m unittest discover -s "$(dirname "$t")" -p 'test_*.py'
          done
      - name: Node tests
        run: |
          for t in $(find modules ui/src tests -name '*.test.mjs' -not -path '*/node_modules/*' | sort); do
            echo "node $t"
            node "$t"
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the gitleaks binary directly (pinned) rather than the action, which is free only via a license
      # dance and mis-encodes non-ASCII output on the runner. Uses .gitleaks.toml at the repo root.
      - name: Run gitleaks
        run: |
          V=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact
